# 通用职业 × 国家/地区 — 人才需求深度分析 (McKinsey风格)
# 触发示例: 迪拜网络安全工程师, UAE cybersecurity, 德国汽车工程师, 新加坡数据分析师, 澳洲会计师
id: profession_country
version: 1
enabled: true

# ── 数据来源合规策略 (强制) ──
data_source_policy:
  mode: english_authoritative_only
  allowed_sources:
    - World Bank
    - IMF
    - ILO
    - OECD
    - UNCTAD
    - WEF
    - (ISC)²
    - ISACA
    - CompTIA
    - Gartner
    - IDC
    - Forrester
    - NIST
    - SANS Institute
    - Hays
    - Michael Page
    - Robert Half
    - Mercer
    - Numbeo
    - UAE MOHRE
    - UAE Federal Authority for Identity, Citizenship, Customs & Port Security
    - Dubai Statistics Center
    - Dubai Land Department
    - 各国统计局官方门户 (英文界面)
    - 各国移民局官方门户 (英文界面)
    - 各国教育部官方门户 (英文界面)
  forbidden_sources:
    - 任何中文网站 (包括知乎、百度、微信公众号、小红书、微博)
    - 任何中文留学/移民中介网站
    - 任何中文房产中介网站
    - 任何 UGC 平台 (TripAdvisor, Yelp, Glassdoor 须经官方校验)
  output_language: zh

label:
  zh: "[[country]][[profession]]人才需求与就业前景深度分析"
  en: "[[country]] [[profession]] Talent Demand & Career Outlook Deep Dive"

description:
  zh: "面向[[country]]的[[profession]]岗位，以麦肯锡咨询风格输出人才市场深度分析报告。覆盖18大维度：(1)行业宏观趋势与数字化转型驱动 (2)人才需求规模与增长预测 (3)雇主格局与企业需求热力图 (4)薪酬基准与购买力对比 (5)技能栈要求与认证路径 (6)人才供给缺口量化 (7)外籍人才政策与工作签证路径 (8)风险评估与5年职业ROI模型 (9)生活成本精算与净储蓄模型 (10)全球竞争城市对标 (11)AI/自动化颠覆风险时间线 (12)行业合规框架映射 (13)候选人供给密度与竞争力 (14)雇主微观情报 (15)签证全流程时间轴 (16)跨文化适应路径指南 (17)薪资谈判话术与策略 (18)职业资格认证全路径。数据来源于世界银行/ILO/MERCER/Numbeo/(ISC)²/ISACA/Gartner/SANS/Hays/MOHRE/各国统计局/行业协会/官方劳动力调查，排除任何中文网站来源。"
  en: "McKinsey-style deep-dive analysis of [[profession]] talent market in [[country]]. 18 dimensions: industry trends, talent demand sizing, employer landscape, salary benchmarking, skill requirements, talent supply gap, expat/visa policies, 5-year career ROI, cost of living & net savings model, global city comparison, AI disruption risk timeline, compliance framework mapping, candidate supply metrics, employer micro-intelligence, visa process timeline, cross-cultural adaptation guide, salary negotiation tactics, professional certification roadmap. Data from World Bank, ILO, MERCER, Numbeo, (ISC)², ISACA, Gartner, SANS, Hays, MOHRE, national statistics, industry associations."

triggers:
  - "迪拜网络安全工程师"
  - "迪拜网络安全"
  - "迪拜安全工程师"
  - "迪拜AI安全工程师"
  - "迪拜人工智能安全"
  - "UAE AI security engineer"
  - "UAE cybersecurity engineer"
  - "UAE cyber security"
  - "Dubai cybersecurity"
  - "Dubai AI security"
  - "阿联酋网络安全"
  - "阿联酋AI安全"
  - "迪拜工程师"
  - "Dubai engineer"
  - "UAE engineer"
  - "阿联酋工程师"
  - "迪拜IT"
  - "迪拜技术岗位"
  - "country profession"
  - "职业分析"
  - "人才需求分析"
  - "海外就业分析"
  - "德国汽车工程师"
  - "德国工程师"
  - "Germany automotive engineer"
  - "新加坡数据分析师"
  - "Singapore data analyst"
  - "澳洲会计师"
