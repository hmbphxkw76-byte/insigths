# 荷兰(Netherlands)本科留学申请全景分析 — Prompt 定义
# 触发关键词: 荷兰留学, 荷兰本科, 阿姆斯特丹大学, 代尔夫特理工, 莱顿大学, TU Delft, Study in Holland, 橙色郁金香奖
id: nl_undergraduate_study
version: 1
enabled: true

# ── 数据来源合规策略 (强制字段) ──
data_source_policy:
  mode: english_authoritative_only
  allowed_sources:
    - Study in Holland (studyinholland.nl)
    - Nuffic
    - IND - Immigration and Naturalisation Service
    - Orange Knowledge Programme (OKP)
    - QS World University Rankings
    - Times Higher Education
  forbidden_sources:
    - 任何中文网站
    - 任何中文留学中介网站
  output_language: zh

label:
  zh: 荷兰本科留学申请全景分析报告
  en: Netherlands Undergraduate Study Application Analysis

description:
  zh: 高中毕业->荷兰(Netherlands)的本科留学路径分析。覆盖教育体系架构、入学路径与录取标准、学费与奖学金、签证与居留政策、毕业后就业与回国发展。数据来源仅限官方机构与英文权威来源。
  en: Undergraduate study in Netherlands for Chinese high school graduates. Covers education system, admission pathways, tuition, visa, and post-graduation career development.

triggers:
    - "荷兰留学"
    - "荷兰本科"
    - "阿姆斯特丹大学"
    - "代尔夫特理工"
    - "莱顿大学"
    - "TU Delft"
    - "Study in Holland"
    - "橙色郁金香奖"

horizon:
  type: future_years
  value: 4

geo:
  region_zh: 荷兰
  region_en: Netherlands
  country_code: NL
  peers:
    - "Germany (TU9)"
    - "UK (Russell Group)"
    - "Nordics (KTH/Aalto)"
    - "Belgium (KU Leuven)"
  focus_schools:
    - "University of Amsterdam (UvA)"
    - "Delft University of Technology (TU Delft)"
    - "Leiden University"
    - "Utrecht University"
    - "Erasmus University Rotterdam"
    - "University of Groningen"

data_pipes:
  - pipe: nl_bachelor_admissions
    params:
      fields: ["university_zh", "university_en", "qs_rank_2025", "ielts_min", "gaokao_pathway", "annual_tuition_eur", "top_programs", "moe_recognized"]
      source_url: https://www.studyinholland.nl
  - pipe: nl_visa_poststudy
    params:
      source_url: https://ind.nl/en/study
      fields: ["visa_cat", "duration", "work_rights", "pr_path", "condition"]
  - pipe: nl_scholarships
    params:
      source_url: https://www.studyinholland.nl/scholarships
      fields: ["name", "provider", "benefit", "level", "amount", "coverage", "comp"]

analysis_dimensions:
  - id: nl_bachelor_admission_standards
    label_zh: 本科录取标准与入学路径
    label_en: Bachelor's Admission Standards
    method: admission_standard_analysis
    required_data: [nl_bachelor_admissions]

  - id: nl_tuition_and_costs
    label_zh: 学费与留学成本
    label_en: Tuition & Study Costs
    method: cost_model
    required_data: [nl_bachelor_admissions]

  - id: nl_scholarship_overview
    label_zh: 可申请奖学金概览
    label_en: Scholarships Available
    method: scholarship_analysis
    required_data: [nl_scholarships]

  - id: nl_visa_and_post_study_work
    label_zh: 学生签证与毕业后工作权利
    label_en: Student Visa & Post-Study Work
    method: policy_scan
    required_data: [nl_visa_poststudy]

  - id: nl_employment_and_roi
    label_zh: 就业前景与投资回报率
    label_en: Employment Outlook & ROI
    method: career_outcome_analysis
    required_data: [nl_bachelor_admissions]

  - id: nl_application_timeline
    label_zh: 申请时间轴与关键节点
    label_en: Application Timeline
    method: timeline_projection
    required_data: [nl_bachelor_admissions]

  - id: nl_risk_assessment
    label_zh: 风险矩阵与备选路径
    label_en: Risk Matrix & Alternatives
    method: risk_analysis
    required_data: [nl_visa_poststudy, nl_bachelor_admissions]

report:
  template: study_abroad_analysis
  output_dir: reports/studyabroad/nl_undergraduate
  style:
    primary_color: #FF6600
    accent_color: "#ffffff"
  format:
    type: html

schedule:
  cadence: quarterly
  month: [1, 4, 7, 10]
  day_of_week: monday
  week_of_month: 2
  time: "09:00"

quality:
  min_data_freshness_days: 90
  min_sources_per_section: 3
  required_disclaimers:
    - not_legal_or_immigration_advice
    - verify_accreditation_independently
    - verify_information_with_official_sources
