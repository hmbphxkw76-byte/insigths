# ---------------------------------------------------------------------
# 数据源配置（用于自动数据采集管道）
# 覆盖13国官方数据源 + 奖学金机构
# ---------------------------------------------------------------------
data_sources:
  fr_engineering:
    - name: "CTI - Commission des Titres d'Ingénieur"
      url: "https://www.cti-commission.fr"
      frequency: "yearly"
      data_type: "accreditation_list"
    - name: "Campus France Chine"
      url: "https://chine.campusfrance.org"
      frequency: "monthly"
      data_type: "program_listings"
    - name: "France-Visas"
      url: "https://france-visas.gouv.fr"
      frequency: "as_needed"
      data_type: "visa_policy"
    - name: "INSEE - 法国国家统计与经济研究所"
      url: "https://www.insee.fr/en/accueil"
      frequency: "quarterly"
      data_type: "economic_data"

  jp_study:
    - name: "JASSO - 日本学生支援机构"
      url: "https://www.jasso.go.jp/en"
      frequency: "yearly"
      data_type: "scholarships_and_statistics"
    - name: "MEXT - 日本文部科学省"
      url: "https://www.mext.go.jp/en"
      frequency: "yearly"
      data_type: "policy_and_regulations"
    - name: "JPSS - Japan Study Support"
      url: "https://www.jpss.jp/en"
      frequency: "monthly"
      data_type: "program_listings"
    - name: "出入国在留管理庁"
      url: "https://www.moj.go.jp/isa/index.html"
      frequency: "as_needed"
      data_type: "visa_policy"
    - name: "EJU - 日本留学試験"
      url: "https://www.jasso.go.jp/en/study_j/eju/index.html"
      frequency: "twice_yearly"
      data_type: "exam_requirements"

  de_study:
