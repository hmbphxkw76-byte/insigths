# =====================================================================
# 留学分析模块配置
# =====================================================================
# 本文件为 studyabroad 子模块的索引配置，列出所有已启用的留学分析
# Prompt 定义文件及其元数据。由 scheduler / 分析器读取。
# =====================================================================

module:
  name: studyabroad
  label_zh: 留学申请分析(本科/硕士/博士+奖学金)
  label_en: Study Abroad Analysis (Bachelor/Master/PhD+Scholarships)
  description: 面向中国学生的13国留学申请全景分析，覆盖本科/硕士/博士/奖学金/签证/就业全维度
  version: 2
  output_base_dir: reports/studyabroad

# ---------------------------------------------------------------------
# 各国 Prompt 定义文件注册 — 共13国 × (本科+硕士+博士) = 39条 + 法国工程师专项
